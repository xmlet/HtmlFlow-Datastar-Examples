<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signal Complex Domain — HTML</title>
    <link rel="icon" href="/images/htmlflow-logo.png">
    <script type="module" src="/js/datastar.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="demo-description">
        <p class="demo-source-links">
            Source code:
            <a href="https://github.com/xmlet/HtmlFlow-Datastar-Examples/blob/main/datastar-examples/src/main/resources/public/html/signal-complex-domain.html" target="_blank" rel="noopener noreferrer">HTML view</a>
            · <a href="https://github.com/xmlet/HtmlFlow-Datastar-Examples/blob/main/datastar-examples/src/main/kotlin/pt/isel/ktor/DemoSignalComplexDomain.kt" target="_blank" rel="noopener noreferrer">Ktor server</a>
        </p>
    </div>
    <div data-signals="{person: {name: 'John', age: 18}}">
        <p>Name: <span data-text="$person.name"></span></p>
        <p>Age: <span data-text="$person.age"></span></p>
        <button data-on:click="@put('/complex-domain/increase-age')">Increase Age</button>
        <button data-on:click="@put('/complex-domain/switch-user')">Switch User</button>
    </div>
</body>
</html>
